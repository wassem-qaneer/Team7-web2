<div class="container my-5">
  <h2 class="text-center mb-4 fw-bold text-purple">Employer Benefits</h2>
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let benefit of benefits">
      <div class="card h-100 border-0 shadow-sm p-3 text-center">
        <img [src]="benefit.image" class="mb-3" alt="Icon" style="width: 60px; height: 60px;" />
        <h5 class="fw-bold">{{ benefit.title }}</h5>
        <p class="text-muted">{{ benefit.description }}</p>
      </div>
    </div>
  </div>
</div>
