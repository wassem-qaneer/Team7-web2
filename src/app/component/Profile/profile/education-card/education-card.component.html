<div class="card h-100 shadow-sm">
    <div class="row g-0">
      <div class="col-9 p-3">
        <h6 class="mb-1">{{ education.degree }}</h6>
        <small class="text-muted d-block">{{ education.school }}</small>
        <small class="text-muted">{{ education.period }}</small>
        <div class="mt-2">
          <button class="btn btn-sm btn-purple">Edit</button>
        </div>
      </div>
      <div class="col-3 d-flex align-items-center justify-content-center">
        <img [src]="'https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Columbia_University_Master%27s_Degree.jpg/1024px-Columbia_University_Master%27s_Degree.jpg'" class="img-fluid rounded-end" alt="Graduation image">
      </div>
    </div>
  </div>
