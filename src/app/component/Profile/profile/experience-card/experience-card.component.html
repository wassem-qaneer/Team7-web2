<div class="card h-100 shadow-sm">
    <div class="row g-0">
      <div class="col-8 p-3">
        <h6 class="mb-1">{{ experience?.company }}</h6>
        <small class="text-muted d-block">{{ experience.role }}</small>
        <small class="text-muted">{{ experience.start }} - {{ experience.end }}</small>
        <div class="mt-2">
          <button class="btn btn-sm btn-purple">Edit</button>
        </div>
      </div>
      <div class="col-4 d-flex align-items-center justify-content-center">
        <img [src]="experience.image" class="img-fluid rounded-end" alt="Company image">
      </div>
    </div>
  </div>
