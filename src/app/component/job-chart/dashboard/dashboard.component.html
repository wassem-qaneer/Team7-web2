<div class="dashboard-container">
    <header>
      <h1>statistics    </h1>
    </header>
  
    <div class="content-wrapper">
      <main class="main-content">
        <div class="time-display">
          24-hour format | Short 24-hour | 24
        </div>
  
        <div class="stats">
          <div class="stat-card">
            <h3>Monthly Job Applications</h3>
            <div *ngFor="let app of jobApplications" class="stat-value">
              {{ app | number }}
            </div>
          </div>
  
          <div class="stat-card">
            <h3>Monthly Job Postings</h3>
            <div *ngFor="let post of jobPostings" class="stat-value">
              {{ post }}
            </div>
          </div>
        </div>
      </main>
  
      <aside class="control-panel">
        <h2>Control Panel</h2>
        <ul>
          <li>Job Seekers</li>
          <li>Add Job</li>
          <li>Edit Job</li>
          <li>Job ID</li>
          <li>Salary Range</li>
          <li>Admin Messaging</li>
        </ul>
      </aside>
    </div>
  </div>
