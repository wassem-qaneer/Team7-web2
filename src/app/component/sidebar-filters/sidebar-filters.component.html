<div class="card p-3 shadow-sm">
  <h5 class="mb-3">Filter Jobs</h5>

  <div class="mb-3">
    <label for="filter-location" class="form-label">Location</label>
    <input type="text" class="form-control" id="filter-location" placeholder="Enter location">
  </div>

  <div class="mb-3">
    <label for="filter-job-type" class="form-label">Job Type</label>
    <select class="form-select" id="filter-job-type">
      <option value="">All</option>
      <option value="fulltime">Full-Time</option>
      <option value="parttime">Part-Time</option>
      <option value="remote">Remote</option>
    </select>
  </div>

  <button class="btn btn-purple w-100">Apply Filters</button>
</div>
