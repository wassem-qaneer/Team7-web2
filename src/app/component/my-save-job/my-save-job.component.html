<main class="row">
  <nav class="navbar navbar-expand-lg navbar-light bg-light px-4 py-3 ">
    <a class="navbar-brand d-flex align-items-center">
      <img src="assets/Logo.jpg" alt="Logo" class="logo-img me-2">
      <h3 class="mb-0">JobConnect</h3>
    </a>


    <div class="ms-auto d-flex align-items-center flex-wrap gap-3">
      <a class="nav-link" href="#Dashbord">Dashboard</a>
      <a class="nav-link" href="#Jobs">Jobs</a>
      <a class="nav-link" href="#applicants">Applicants</a>
      <a class="nav-link" href="#settings">Settings</a>
      <a href="#profile" class="profile-link">
        <img src="assets/profile.jpg" alt="Profile">
      </a>
    </div>
  </nav>

  <section class="container my-4">
    <h2 class="text-center title">My Saved Job</h2>
    <div class="row">
      <div class="col-lg-4 col-md-6 col-sm-12 mb-4" *ngFor="let job of visibleJobs; let i = index">
        <div class="job-card">
          <img [src]="job.image" alt="Job Image" class="job-image mb-3">
          <h4>{{ job.title }}</h4>
          <p><strong>Applications:</strong> {{ job.applications }}</p>
          <p class="status">{{ job.status }}</p>
          <button class="btn remove-btn" (click)="remove(i)">Remove</button>
        </div>
      </div>
    </div>

    <div class="text-center">
      <button class="btn show-more"
              (click)="showMore()"
              [disabled]="allJobsShown">
        Show More
      </button>
    </div>
  </section>
</main>
