<div class="container" style="margin-top: 6rem;">
  <h2 style="font-weight: bold; display: inline; padding-right: 2rem">Job Postings</h2>
  <button type="button" id="btn1" class="btn btn-primary" style="margin-bottom: 8px; display: inline" routerLink="/postNewJob">
    Post A Job
  </button>

  <div class="input-group mb-3 mt-3" style="max-width: 30rem">
    <input
      type="text"
      class="form-control"
      placeholder="Enter Employee Name"
      aria-label="Enter Employee Name"
      aria-describedby="button-addon2"
      [(ngModel)]="searchEmployee"
      (input)="filterJobs()"
    >
    <button class="btn btn-outline-secondary" type="button" id="button-addon2" (click)="filterJobs()">Search</button>
  </div>

  <div class="table-responsive-md">
    <table class="table table-striped table-bordered table-hover" style="margin-top: 1rem; max-width: 75rem">
      <thead>
        <tr>
          <th>ID</th>
          <th>Job Title</th>
          <th>Company</th>
          <th>Employee Name</th>
          <th>Job Status</th>
          <th style="text-align: center;" colspan="2">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let job of filteredJobPostings">
          <td>{{ job.id }}</td>
          <td>{{ job.title }}</td>
          <td>{{ job.company }}</td>
          <td>{{ job.employeeName }}</td>
          <td>
            <select class="form-select" [(ngModel)]="job.status" style="max-width: 12rem">
              <option value="Open">Open</option>
              <option value="Close">Close</option>
            </select>
          </td>
          <td style="text-align: center; display: flex; justify-content: space-evenly;">
            <button type="button" class="btn btn-outline-primary" id="Delete{{job.id}}" (click)="deleteJob(job.id)">Delete</button>
            <button type="button" class="btn btn-outline-primary" id="Approve{{job.id}}" (click)="approveJob(job.id)">Approve</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
